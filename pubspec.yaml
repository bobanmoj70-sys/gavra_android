name: gavra_android
description: Gavra 013 - Aplikacija zatvorenog tipa za organizaciju polazaka
version: 6.0.584



environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_dotenv: ^5.1.0
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter
  supabase_flutter: ^2.12.0
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5
  flutter_local_notifications: 17.2.3
  fl_chart: ^0.68.0
  http: ^1.2.1
  package_info_plus: ^9.0.0
  url_launcher: ^6.1.0
  logger: ^2.6.0
  audioplayers: ^6.5.0
  async: ^2.11.0
  collection: ^1.19.0
  path_provider: ^2.1.5
  open_filex: ^4.0.0
  permission_handler: ^11.0.1
  geolocator: ^13.0.2
  dropdown_button2: ^2.3.9
  flutter_secure_storage: ^10.0.0
  shared_preferences: ^2.5.4
  # NAPOMENA: shared_preferences_android verzija se povlači transitivno preko federated plugina
  wakelock_plus: ^1.3.2
  google_fonts: ^6.0.0

  shimmer: ^3.0.0
  device_info_plus: ^11.3.0
  android_intent_plus: ^6.1.0
  # flutter_sms uklonjen: SMS ide preko `url_launcher` (`sms:` intent)
  # sms_advanced: ^1.0.1 # Alternativa sa automatskim slanjem - isto ima namespace problem
  # Vraćam se na URL launcher pristup - jedini koji radi
  # printing: ^5.14.2  # removed for Android-only build to avoid web dependency conflicts
  pdf: ^3.11.3
  timezone: ^0.9.4
  # graphql: ^5.1.2  # UKLONJENO 2026-01-05 - nije korišćen
  # graphql_flutter: ^5.1.2  # UKLONJENO 2026-01-05 - nije korišćen
  uuid: ^4.4.0
  # supabase: ^2.10.0  # UKLONJENO 2026-01-05 - duplikat (već u supabase_flutter)

  # 🏗️ STATE MANAGEMENT & IMMUTABLE MODELS
  freezed_annotation: ^2.4.0
  json_annotation: ^4.8.1

  sqflite: ^2.4.1

  vibration: ^3.1.4

  # 🗺️ MAPA (besplatno, bez API ključa) — prikaz trenutne pozicije vozača adminu
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # 🛰️ Background GPS tracking servis za vozača
  flutter_background_service: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.6
  freezed: ^2.4.0
  json_serializable: ^6.7.1
  flutter_launcher_icons: ^0.14.3

dependency_overrides:
  app_links: ^6.1.2

# 🎨 LAUNCHER ICONS — ONLY from assets/branding/gavra_icon.png
# After changing the master, run: scripts/sync_branding_icons.ps1
flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: "assets/branding/gavra_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/branding/gavra_icon.png"
  adaptive_icon_foreground_inset: 16

flutter:
  uses-material-design: true

  assets:
    - .env # 🔐 Environment varijable (Supabase kredencijali)
    - assets/kasno_je.mp3 # 🎵 GAVRA 013 pesma "Beogradski sindikat - Kasno je"
    # Branding — ONLY master (crna + plava). Launchers via flutter_launcher_icons.
    - assets/branding/gavra_icon.png
    - assets/weather/ # 🌤️ Vremenske ikone
    - assets/fonts/Lato-Regular.ttf
    - assets/fonts/Lato-Bold.ttf
    - assets/fonts/NotoSans-Regular.ttf
    - assets/fonts/NotoSans-Bold.ttf



