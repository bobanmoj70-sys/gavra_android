# Low-RAM hosts (local ~8GB + GitHub Actions ubuntu-latest ~7GB):
# keep heap modest so the JVM does not GC-thrash / get killed mid-build.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=128m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseG1GC -XX:MaxGCPauseMillis=200
# Lint runs in its own worker JVM (separate from the main daemon); give it enough metaspace
# to avoid "Metaspace" OutOfMemoryError crashes during lintVitalAnalyzeRelease on AGP 9 + K2 UAST.
android.lint.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:+UseG1GC
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.daemon=true
org.gradle.configureondemand=true
org.gradle.vfs.watch=true
org.gradle.configuration-cache=false
org.gradle.workers.max=2

android.useAndroidX=true
android.enableJetifier=false
android.enableR8.fullMode=true
android.r8.optimizedResourceShrinking=true
android.javaCompile.suppressSourceTargetDeprecationWarning=true
android.defaults.buildfeatures.shaders=false

# AGP 9 + Flutter: legacy Android DSL + external Kotlin plugin (required until Flutter catches up)
android.newDsl=false
android.builtInKotlin=false

kotlin.incremental=true
kotlin.jvm.target.validation.mode=warning
# Cap Kotlin daemon so it does not compete with Gradle/R8 on 7-8GB runners
kotlin.daemon.jvmargs=-Xmx768m -XX:MaxMetaspaceSize=256m -XX:+UseG1GC
